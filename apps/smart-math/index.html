<script>
'use strict';
/* =====================================================================
 * 1. 수학 유틸리티
 * ===================================================================== */
const R = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const nz = (a, b) => { let v; do { v = R(a, b); } while (v === 0); return v; };
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; };
const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
const fact = (n) => { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; };
const nPr = (n, r) => { let x = 1; for (let i = 0; i < r; i++) x *= (n - i); return x; };
const nCr = (n, r) => Math.round(nPr(n, r) / fact(r));
const digits = (n) => String(Math.abs(n)).split('').reverse().map(Number); // 일의 자리부터
const PLACES = ['일', '십', '백', '천', '만'];
const par = (n) => (n < 0 ? `(${n})` : `${n}`); // 음수에 괄호
const sgnNum = (n) => (n < 0 ? `- ${-n}` : `+ ${n}`);

/** 분수 클래스 (항상 기약분수, 분모 양수) */
class F {
  constructor(n, d = 1) {
    if (d === 0) throw new Error('division by zero');
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d); this.n = n / g; this.d = d / g;
    if (Object.is(this.n, -0)) this.n = 0;
  }
  static of(x) { return x instanceof F ? x : new F(x, 1); }
  add(o) { o = F.of(o); return new F(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o) { o = F.of(o); return new F(this.n * o.d - o.n * this.d, this.d * o.d); }
  mul(o) { o = F.of(o); return new F(this.n * o.n, this.d * o.d); }
  div(o) { o = F.of(o); return new F(this.n * o.d, this.d * o.n); }
  neg() { return new F(-this.n, this.d); }
  inv() { return new F(this.d, this.n); }
  val() { return this.n / this.d; }
  isInt() { return this.d === 1; }
  toString() { return this.d === 1 ? `${this.n}` : `${this.n}/${this.d}`; }
  tex() { if (this.d === 1) return `${this.n}`; return `${this.n < 0 ? '-' : ''}\\frac{${Math.abs(this.n)}}{${this.d}}`; }
  mixedTex() {
    const a = Math.abs(this.n); if (this.d === 1 || a < this.d) return this.tex();
    const w = Math.floor(a / this.d), r = a % this.d;
    return `${this.n < 0 ? '-' : ''}${w}${r ? `\\frac{${r}}{${this.d}}` : ''}`;
  }
}
const fr = (n, d = 1) => new F(n, d);
const sfr = (n, d) => (d === 0 ? null : new F(n, d)); // 오답 함정용 (분모 0이면 제외)
const ftex = (n, d) => fr(n, d).tex();

/** 다항식 TeX: coefs = [최고차, ..., 상수] */
function poly(coefs, v = 'x') {
  const deg = coefs.length - 1; let s = '';
  coefs.forEach((c0, i) => {
    const c = F.of(c0); const p = deg - i; if (c.n === 0) return;
    const abs = new F(Math.abs(c.n), c.d);
    const coefTex = (abs.n === 1 && abs.d === 1 && p > 0) ? '' : abs.tex();
    const term = coefTex + (p > 0 ? v : '') + (p > 1 ? `^{${p}}` : '');
    if (s === '') s = (c.n < 0 ? '-' : '') + term; else s += (c.n < 0 ? ' - ' : ' + ') + term;
  });
  return s || '0';
}
/** ax + by 꼴 */
function lin2(a, b, x = 'x', y = 'y') {
  const t = (c, v, first) => {
    if (c === 0) return '';
    const abs = Math.abs(c) === 1 ? '' : Math.abs(c);
    return first ? `${c < 0 ? '-' : ''}${abs}${v}` : ` ${c < 0 ? '-' : '+'} ${abs}${v}`;
  };
  const s = t(a, x, true); return s + t(b, y, s === '');
}
/** 복소수 a+bi TeX */
function cpx(a, b) {
  if (b === 0) return `${a}`;
  const bi = (Math.abs(b) === 1 ? '' : Math.abs(b)) + 'i';
  if (a === 0) return (b < 0 ? '-' : '') + bi;
  return `${a} ${b < 0 ? '-' : '+'} ${bi}`;
}
/** 소수 표기: v / 10^p */
const dec = (v, p) => String(+(v / 10 ** p).toFixed(p));
/** 소인수분해 TeX */
function pfTex(n) {
  const f = []; let m = n;
  for (let p = 2; p * p <= m; p++) { let e = 0; while (m % p === 0) { m /= p; e++; } if (e) f.push(e > 1 ? `${p}^{${e}}` : `${p}`); }
  if (m > 1) f.push(`${m}`);
  return f.join(' \\times ');
}

/* ---------- 세로셈 풀이 과정 도우미 ---------- */
function colAddSteps(a, b) {
  const steps = []; let carry = 0; const da = digits(a), db = digits(b); const n = Math.max(da.length, db.length);
  steps.push(`자리를 맞춰 세로로 써요. 일의 자리부터 차례로 더해요.`);
  for (let i = 0; i < n; i++) {
    const x = da[i] || 0, y = db[i] || 0; const s = x + y + carry;
    let t = `<b>${PLACES[i]}의 자리</b>: $${x} + ${y}${carry ? ' + 1' : ''} = ${s}$`;
    if (carry) t += ` <span class="text-ink-400">(받아올린 1 포함)</span>`;
    t += s >= 10 ? ` → <b>${s % 10}</b>을(를) 쓰고 <b>1</b>을 윗자리로 받아올려요.` : ` → <b>${s}</b>을(를) 써요.`;
    carry = s >= 10 ? 1 : 0; steps.push(t);
  }
  if (carry) steps.push(`마지막에 받아올린 <b>1</b>을 맨 앞자리에 써요.`);
  steps.push(`그래서 $${a} + ${b} = ${a + b}$ 이에요.`);
  return steps;
}
function colSubSteps(a, b) {
  const steps = []; const da = digits(a), db = digits(b); let borrow = 0;
  steps.push(`자리를 맞춰 세로로 써요. 일의 자리부터 빼요.`);
  for (let i = 0; i < da.length; i++) {
    const orig = da[i]; let x = orig - borrow; const y = db[i] || 0;
    let t = `<b>${PLACES[i]}의 자리</b>: `;
    if (borrow) t += `아랫자리에 10을 빌려줬으니 $${orig} \\to ${x < 0 ? 9 : x}$${x < 0 ? ' (0이라서 다시 윗자리에서 빌려와요)' : ''}. `;
    if (x < 0) { x += 10; borrow = 1; if (x < y) { /* not possible for single digits */ } }
    else if (x < y) { t += `$${x}$에서 $${y}$을(를) 뺄 수 없으니 윗자리에서 10을 빌려와요: $10 + ${x} - ${y} = ${10 + x - y}$`; borrow = 1; steps.push(t); continue; }
    else borrow = 0;
    if (i >= db.length && y === 0 && x === 0 && i === da.length - 1) { t += '남는 수가 없어요.'; steps.push(t); continue; }
    t += `$${x} - ${y} = ${x - y}$`; steps.push(t);
  }
  steps.push(`그래서 $${a} - ${b} = ${a - b}$ 이에요.`);
  return steps;
}
function noCarryAdd(a, b) { const da = digits(a), db = digits(b); const n = Math.max(da.length, db.length); let r = 0; for (let i = n - 1; i >= 0; i--) r = r * 10 + (((da[i] || 0) + (db[i] || 0)) % 10); return r; }
function smallFromLarge(a, b) { const da = digits(a), db = digits(b); let r = 0; for (let i = da.length - 1; i >= 0; i--) r = r * 10 + Math.abs((da[i] || 0) - (db[i] || 0)); return r; }
function noCarryMul(a, k) { const da = digits(a); let s = ''; for (let i = 0; i < da.length; i++) { const p = da[i] * k; s = (i === da.length - 1 ? String(p) : String(p % 10)) + s; } return Number(s); }

/* =====================================================================
 * 2. 문제 뱅크 (학년 → 단원 → 난이도별 무작위 생성기)
 *   생성기 반환 형식:
 *   { prompt, expr, ans, type('num'|'pair'|'set'), hint, steps[], traps[[오답, 짚어줄 개념 실수]] }
 *   - prompt/steps/hint 안의 $...$ 는 KaTeX 로 렌더링
 * ===================================================================== */
function mk(o) {
  return {
    prompt: o.prompt || '계산해 보세요.', expr: o.expr || '', ans: String(o.ans), type: o.type || 'num',
    hint: o.hint || '', steps: o.steps || [], traps: (o.traps || []).filter(([v]) => v !== null && v !== undefined).map(([v, m]) => [String(v), m]),
    format: o.format || '',
  };
}

const GRADE_NAMES = ['', '초1', '초2', '초3', '초4', '초5', '초6', '중1', '중2', '중3', '고1', '고2', '고3'];
const GRADE_LONG = ['', '초등 1학년', '초등 2학년', '초등 3학년', '초등 4학년', '초등 5학년', '초등 6학년', '중학 1학년', '중학 2학년', '중학 3학년', '고등 1학년', '고등 2학년', '고등 3학년'];
const LEVELS = ['하', '중', '상', '최상'];
const UNITS = []; // {id, g, name, desc, gen}
const U = (g, id, name, desc, gen) => UNITS.push({ g, id, name, desc, gen });
const unitById = (id) => UNITS.find((u) => u.id === id);
const unitsOf = (g) => UNITS.filter((u) => u.g === g);

/* ---------------------------- 초등 1학년 ---------------------------- */
U(1, 'e1-add', '한 자리 수의 덧셈', '10 만들기로 더하기', (d) => {
  if (d === 2) {
    const a = R(1, 9), b = R(1, 9), c = R(1, 9), s = a + b + c;
    return mk({ prompt: '세 수를 더해 보세요.', expr: `${a}+${b}+${c}=\\square`, ans: s,
      hint: '세 수는 한꺼번에 더하지 말고, 앞의 두 수부터 차례로 더해요.',
      steps: [`앞의 두 수부터 더해요: $${a}+${b}=${a + b}$`, `그 결과에 남은 수를 더해요: $${a + b}+${c}=${s}$`, `정답은 $${s}$ 이에요. 잘했어요!`],
      traps: [[a + b, '마지막 수 ' + c + '을(를) 더하는 걸 깜빡했어요.'], [s - 1, '하나를 덜 셌어요. 손가락으로 천천히 다시 세어 봐요.'], [s + 1, '하나를 더 셌어요. 이어 세기를 할 때 시작하는 수는 세지 않아요.']] });
  }
  let a, b;
  if (d === 0) { a = R(1, 8); b = R(1, 9 - a); }
  else { a = R(2, 9); b = R(11 - a, 9); }
  const s = a + b;
  if (d === 0) return mk({ expr: `${a}+${b}=\\square`, ans: s, hint: `${a}에서 시작해서 ${b}만큼 이어 세어 보세요.`,
    steps: [`큰 수 $${Math.max(a, b)}$에서 시작해요.`, `$${Math.min(a, b)}$만큼 이어 세어요: ${Array.from({ length: Math.min(a, b) }, (_, i) => Math.max(a, b) + i + 1).join(', ')}`, `그래서 $${a}+${b}=${s}$ 이에요.`],
    traps: [[s - 1, '이어 세기를 할 때 하나를 덜 셌어요.'], [s + 1, '이어 세기를 할 때 시작하는 수까지 세어서 하나가 많아졌어요.'], [Math.abs(a - b), '더하기(+)인데 빼기를 했어요. 기호를 다시 확인해요!']] });
  const k = 10 - a;
  return mk({ expr: `${a}+${b}=\\square`, ans: s, hint: `${a}이(가) 10이 되려면 ${k}이(가) 더 필요해요. ${b}을(를) ${k}와(과) 나머지로 갈라 보세요!`,
    steps: [`$${a}$에 몇을 더하면 10이 될까요? → $${k}$`, `$${b}$를 $${k}$와 $${b - k}$로 갈라요.`, `$${a}+${k}=10$`, `$10+${b - k}=${s}$`, `그래서 $${a}+${b}=${s}$ 이에요.`],
    traps: [[s - 10, '10을 만든 다음, 만든 10을 빼먹었어요. 10과 남은 수를 합쳐야 해요.'], [s - 1, '하나를 덜 셌어요.'], [s + 1, '하나를 더 셌어요.']] });
});

U(1, 'e1-sub', '한 자리 수의 뺄셈', '10에서 빼기, 거꾸로 세기', (d) => {
  if (d === 0) {

/* =====================================================================
 * 12. 세션 구성 (단원 연습 · 오늘의 연산 · 오답 복습)
 * ===================================================================== */
function genUnique(un, d, seen) {
  for (let t = 0; t < 8; t++) { const p = un.gen(d); const key = p.prompt + '|' + p.expr; if (!seen.has(key)) { seen.add(key); return p; } }
  return un.gen(d);
}
/** d가 'auto'면 문제를 보여 줄 때 그 순간의 레벨로 만듦 (풀면서 바로 레벨업이 반영됨) */
function makeItems(un, d, n) {
  const seen = new Set();
  return Array.from({ length: n }, () => (d === 'auto' ? { unitId: un.id, g: un.g, d: null, prob: null } : { unitId: un.id, g: un.g, d, prob: genUnique(un, d, seen) }));
}
function startDaily() {
  const u = App.user, n = u.settings.sessionSize, items = [], seen = new Set();
  const reviews = u.wrong.filter((w) => !w.resolved).slice(-2).reverse();
  reviews.forEach((w) => items.push({ unitId: w.unitId, g: w.g, d: w.d, prob: w.prob, noteId: w.id, review: true }));
  let pool = shuffle(unitsOf(u.grade)); let k = 0;
  while (items.length < n) {
    let un = pool[k++ % pool.length];
    if (u.settings.stretch && u.grade < 12 && Math.random() < 0.3) un = pick(unitsOf(u.grade + 1)); // 한 학년 위 도전
    else if (u.grade > 1 && Math.random() < 0.1) un = pick(unitsOf(u.grade - 1)); // 이전 학년 복습 한 스푼
    items.push({ unitId: un.id, g: un.g, d: null, prob: null });
  }
  startSession(shuffle(items), 'daily', '오늘의 연산');
}
function startSession(items, mode, title) {
  App.session = { items, mode, title, idx: 0, results: [], startedAt: Date.now(), qStart: Date.now(), attempt: 0, seen: new Set() };
  renderSolve();
}

    <div class="space-y-5">
      <div><div class="text-sm text-ink-500 mb-2">학년</div><select id="set-grade" class="w-full px-4 py-3 rounded-2xl bg-lav-50 border border-lav-100 font-jua">${GRADE_LONG.slice(1).map((g, i) => `<option value="${i + 1}" ${u.grade === i + 1 ? 'selected' : ''}>${g}</option>`).join('')}</select></div>
      <div><div class="text-sm text-ink-500 mb-2">난이도</div><div class="flex gap-2 flex-wrap">${[['auto', '자동 (추천)'], ['0', '하'], ['1', '중'], ['2', '상'], ['3', '최상']].map(([v, l]) => `<button data-lv="${v}" class="btn lvopt px-4 py-2 rounded-xl font-jua ${String(s.level) === v ? 'bg-lav-400 text-white' : 'bg-lav-50 text-ink-600'}">${l}</button>`).join('')}</div>
        <div class="text-xs text-ink-400 mt-1">자동: 새 단원은 '중'에서 시작 → 3문제 연속 정답이면 한 단계 위, 2문제 연속 오답이면 한 단계 아래</div></div>
      <div><div class="text-sm text-ink-500 mb-2">하루 목표 문제 수</div>${seg('dailyGoal', [10, 20, 30, 50], s.dailyGoal)}</div>
      <div><div class="text-sm text-ink-500 mb-2">한 번에 푸는 문제 수 (오늘의 연산)</div>${seg('sessionSize', [5, 10, 15, 20], s.sessionSize)}</div>
      <div class="rounded-2xl bg-lav-50/60 p-3">
        ${tog('autoRecognize', '펜을 떼면 자동 인식', '답을 쓰고 잠시 멈추면 자동으로 숫자로 바꿔요')}
        ${tog('penOnly', '펜 전용 모드 (손바닥 무시)', '스타일러스를 쓰면 손가락·손바닥 터치를 무시해요')}
        ${tog('stretch', '한 학년 위 문제 섞기', '오늘의 연산에 다음 학년 단원을 30% 정도 섞어서 도전해요')}
      </div>
      <div class="rounded-2xl bg-butter-50 p-3 text-sm text-ink-600 flex items-center gap-2">✍️ 학습된 내 글씨 샘플 <b>${hwN}</b>개 <button id="hw-reset" class="ml-auto px-3 py-1.5 rounded-xl bg-white text-rose-400">초기화</button></div>
      <div class="rounded-2xl border border-lav-100 p-3"><div class="text-sm text-ink-500 mb-2">📦 기록 백업 / 복원 (JSON)</div>
        <div class="flex gap-2"><button id="exp" class="btn flex-1 py-2.5 rounded-xl bg-sky-100 text-sky-500 font-jua">내보내기(복사)</button><label class="btn flex-1 py-2.5 rounded-xl bg-mint-100 text-mint-600 font-jua text-center cursor-pointer">파일 가져오기<input id="imp" type="file" accept="application/json" class="hidden" /></label></div>
        <textarea id="imp-text" rows="2" class="w-full mt-2 text-xs px-3 py-2 rounded-xl bg-lav-50 border border-lav-100" placeholder="또는 복사해 둔 기록(JSON)을 여기에 붙여 넣으세요"></textarea></div>
      <button id="cloud" class="btn w-full py-3 rounded-2xl bg-lav-50 text-lav-600 font-jua">☁️ 클라우드 동기화 (Supabase) ${DB.cloud ? '— 켜짐' : '— 꺼짐'}</button>
      <button id="del" class="w-full text-sm text-rose-400 underline">이 기기에서 ${esc(u.name)} 프로필 삭제</button>
    </div>
    <button id="close" class="btn btn-3d w-full mt-5 py-3 rounded-2xl bg-lav-400 text-white font-jua text-lg">저장하고 닫기</button>`, {
    onMount: () => {
      $$('.setopt').forEach((b) => b.addEventListener('click', () => { s[b.dataset.set] = +b.dataset.v; $$(`.setopt[data-set="${b.dataset.set}"]`).forEach((x) => { const on = x === b; x.className = `btn setopt px-4 py-2 rounded-xl font-jua ${on ? 'bg-lav-400 text-white' : 'bg-lav-50 text-ink-600'}`; }); }));
      $$('[data-tog]').forEach((c) => c.addEventListener('change', () => { s[c.dataset.tog] = c.checked; }));
      $$('.lvopt').forEach((b) => b.addEventListener('click', () => { s.level = b.dataset.lv === 'auto' ? 'auto' : +b.dataset.lv; $$('.lvopt').forEach((x) => { x.className = `btn lvopt px-4 py-2 rounded-xl font-jua ${x === b ? 'bg-lav-400 text-white' : 'bg-lav-50 text-ink-600'}`; }); }));
      $('#hw-reset').addEventListener('click', () => askConfirm('학습된 글씨 샘플을 모두 지울까요?', () => { u.hw = {}; save(); toast('초기화했어요'); }, '지우기'));
      $('#exp').addEventListener('click', async () => {
        const json = JSON.stringify(u);
        try { await navigator.clipboard.writeText(json); toast('기록(JSON)을 클립보드에 복사했어요 📋 메모장 등에 붙여 넣어 보관하세요.'); } catch { toast('복사하지 못했어요. 브라우저에서 직접 열어 다시 시도해 주세요.'); }
        try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(u, null, 2)], { type: 'application/json' })); a.download = `smartmath-${u.id}-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); } catch { /* 다운로드가 막힌 환경 */ }
      });
      const importJson = (t) => { try { const d = JSON.parse(t); if (!d.id || !d.days) throw 0; d.id = u.id; App.user = migrateUser(d); save(); closeModal(); renderHome(); toast('기록을 가져왔어요 ✅'); } catch { toast('올바른 백업 기록이 아니에요'); } };
      $('#imp').addEventListener('change', async (e) => importJson(await e.target.files[0].text()));
      $('#imp-text').addEventListener('paste', (e) => { const t = e.clipboardData && e.clipboardData.getData('text'); if (t) { e.preventDefault(); importJson(t); } });
      $('#cloud').addEventListener('click', openCloudSettings);
      $('#del').addEventListener('click', () => askConfirm(`${u.name}의 기록을 이 기기에서 삭제할까요? (되돌릴 수 없어요)`, () => { LocalStore.remove(u.id); renderLogin(); }, '삭제'));
      $('#close').addEventListener('click', () => { u.grade = +$('#set-grade').value; save(); closeModal(); if (App.view === 'home') renderHome(); });
    },
  });
}
function openCloudSettings() {
  const c = LS.get('sm:cloud', {}) || {};
  modal(`<h3 class="font-jua text-2xl text-ink-700">☁️ 클라우드 동기화</h3>
    <p class="text-sm text-ink-500 mt-1 leading-relaxed">무료 <b>Supabase</b> 프로젝트를 연결하면 <code>?user=</code> 개인 링크로 어느 기기에서나 같은 기록을 이어서 쓸 수 있어요. (테이블 생성 SQL은 이 파일 소스의 <b>저장소</b> 섹션 주석 참고)</p>
    <label class="block text-sm text-ink-500 mt-4 mb-1">Project URL</label><input id="c-url" value="${esc(c.url || '')}" placeholder="https://xxxx.supabase.co" class="w-full px-4 py-3 rounded-2xl bg-lav-50 border border-lav-100" />
    <label class="block text-sm text-ink-500 mt-3 mb-1">anon public key</label><input id="c-key" value="${esc(c.key || '')}" placeholder="eyJhbGciOi..." class="w-full px-4 py-3 rounded-2xl bg-lav-50 border border-lav-100" />
    <div id="c-msg" class="text-sm mt-2 text-ink-400"></div>
    <div class="flex gap-2 mt-4"><button id="c-off" class="btn flex-1 py-3 rounded-2xl bg-white border border-lav-100 text-ink-500 font-jua">끄기</button><button id="c-save" class="btn btn-3d flex-[2] py-3 rounded-2xl bg-lav-400 text-white font-jua">연결 테스트 후 저장</button></div>`, {
    onMount: () => {
      $('#c-off').addEventListener('click', () => { LS.del('sm:cloud'); DB.init(); closeModal(); toast('이 기기 저장소만 사용해요 💾'); });
      $('#c-save').addEventListener('click', async () => {
        const url = $('#c-url').value.trim(), key = $('#c-key').value.trim(); if (!url || !key) return ($('#c-msg').textContent = 'URL과 key를 모두 입력해 주세요.');
        $('#c-msg').textContent = '연결 확인 중…';
        try { await new SupabaseStore(url, key).ping(); LS.set('sm:cloud', { url, key }); DB.init(); if (App.user) DB.saveUser(App.user); closeModal(); toast('클라우드 연결 완료! ☁️'); }
        catch (e) { $('#c-msg').innerHTML = `<span class="text-rose-400">연결 실패 (${esc(e.message)}). URL/key와 sm_profiles 테이블·정책을 확인해 주세요.</span>`; }
      });
    },
  });
}
function openTrainer() {
  const u = App.user, seq = shuffle('0123456789'.split('')).concat(shuffle('0123456789/'.split(''))); let i = 0, pad = null;
  modal(`<h3 class="font-jua text-2xl text-ink-700">✍️ 내 글씨 익히기</h3>
    <p class="text-sm text-ink-500 mt-1">화면에 나온 글자를 평소처럼 써 주세요. 내 글씨체를 기억해서 답안 인식이 더 정확해져요.</p>
    <div class="flex items-center justify-between mt-4"><div class="text-ink-500 text-sm"><span id="t-i">1</span> / ${seq.length}</div><div class="font-jua text-ink-700">이 글자를 써 주세요 → <span id="t-ch" class="text-4xl text-lav-600 align-middle ml-1"></span></div></div>
    <div class="answer-paper rounded-2xl border-2 border-dashed border-lav-200 h-[200px] mt-2 overflow-hidden"><canvas id="t-pad" class="ink-canvas"></canvas></div>
    <div id="t-guess" class="text-sm text-ink-400 mt-2 h-5"></div>
    <div class="flex gap-2 mt-3"><button id="t-clear" class="btn flex-1 py-3 rounded-2xl bg-lav-50 text-ink-500 font-jua">다시 쓰기</button><button id="t-ok" class="btn btn-3d flex-[2] py-3 rounded-2xl bg-lav-400 text-white font-jua text-lg">저장하고 다음 →</button></div>
    <button id="t-end" class="w-full mt-3 text-sm text-ink-400 underline">그만하기</button>`, {
    onMount: () => {
      HW.init();
      const show = () => { $('#t-i').textContent = i + 1; $('#t-ch').textContent = seq[i]; $('#t-guess').textContent = ''; pad && pad.clear(); };
      requestAnimationFrame(() => { pad = new InkPad($('#t-pad'), { width: 4.2, onEnd: () => { const r = HW.recognize(pad.inkStrokes(), pad.h, u.hw); $('#t-guess').textContent = `지금 인식 결과: ${r.text || '-'}`; } }); show(); });
      $('#t-clear').addEventListener('click', () => pad.clear());
      $('#t-end').addEventListener('click', () => { save(); closeModal(); if (App.view === 'home') renderHome(); });
      $('#t-ok').addEventListener('click', () => {
        if (!pad.strokes.length) return toast('글자를 써 주세요 ✏️');
        HW.addSample(u, pad.inkStrokes(), seq[i]); i++;
        if (i >= seq.length) { save(); closeModal(); confetti(20); toast('내 글씨 학습 완료! 이제 더 잘 알아봐요 ✨'); if (App.view === 'home') renderHome(); } else show();
      });
    },
  });
}

/* =====================================================================
 * 17. 시작
 * ===================================================================== */
window.addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(() => App.pads.forEach((p) => p.resize()), 150); });
async function boot() {
  DB.init();
  let id = null;
  try { id = new URLSearchParams(location.search).get('user') || hashToId(location.hash); } catch { /* ignore */ }
  if (id) { const u = await DB.loadUser(id); if (u) return login(u); return renderLogin({ prefill: id }); }
  renderLogin();
}
window.addEventListener('hashchange', () => { const id = hashToId(location.hash); if (id && (!App.user || App.user.id !== id)) boot(); });
boot();
</script>
</body>
</html>
